# ------------------
# Spark: Master
# ------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-master
  namespace: datalake
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-master
  template:
    metadata:
      labels:
        app: spark-master
    spec:
      containers:
        - name: spark-master
          image: bitnami/spark:3.4.1
          env:
            - name: SPARK_MODE
              value: master
          ports:
            - containerPort: 7077
            - containerPort: 8080

